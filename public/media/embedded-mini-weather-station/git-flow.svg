<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img"><title>Your folder, local history and GitHub with the commands that move work between them</title><text x="360" y="34" font-family="Verdana, Arial, sans-serif" font-size="18" fill="#f1eee6" text-anchor="middle" font-weight="normal">Git keeps save points of your project</text><rect x="20" y="100" width="150" height="110" rx="10" fill="#232325" stroke="#86d8c9" stroke-width="2"/><text x="95.0" y="149.75" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f1eee6" text-anchor="middle" font-weight="normal">Your folder</text><text x="95.0" y="170.75" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#a8a5a0" text-anchor="middle" font-weight="normal">files you edit</text><rect x="285" y="100" width="150" height="110" rx="10" fill="#232325" stroke="#86d8c9" stroke-width="2"/><text x="360.0" y="139.25" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f1eee6" text-anchor="middle" font-weight="normal">Local history</text><text x="360.0" y="160.25" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#a8a5a0" text-anchor="middle" font-weight="normal">commits, on your</text><text x="360.0" y="181.25" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#a8a5a0" text-anchor="middle" font-weight="normal">laptop</text><rect x="550" y="100" width="150" height="110" rx="10" fill="#232325" stroke="#86d8c9" stroke-width="2"/><text x="625.0" y="149.75" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f1eee6" text-anchor="middle" font-weight="normal">GitHub</text><text x="625.0" y="170.75" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#a8a5a0" text-anchor="middle" font-weight="normal">an online copy</text><line x1="172" y1="155" x2="279.0" y2="155.0" stroke="#f5c48a" stroke-width="3" stroke-linecap="round"/><polygon points="283,155 273.1,159.8 273.1,150.2" fill="#f5c48a"/><text x="228" y="114" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f5c48a" text-anchor="middle" font-weight="normal">git add</text><text x="228" y="134" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f5c48a" text-anchor="middle" font-weight="normal">git commit</text><line x1="437" y1="155" x2="544.0" y2="155.0" stroke="#f5c48a" stroke-width="3" stroke-linecap="round"/><polygon points="548,155 538.1,159.8 538.1,150.2" fill="#f5c48a"/><text x="493" y="142" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f5c48a" text-anchor="middle" font-weight="normal">git push</text><text x="360" y="260" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#f1eee6" text-anchor="middle" font-weight="normal">Each commit is a save point you can go back to.</text><text x="360" y="292" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#a8a5a0" text-anchor="middle" font-weight="normal">GitHub keeps a copy if your laptop dies.</text></svg>