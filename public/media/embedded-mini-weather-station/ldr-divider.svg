<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img"><title>Two voltage dividers showing an LDR in bright and dark light</title><text x="360" y="34" font-family="Verdana, Arial, sans-serif" font-size="18" fill="#f1eee6" text-anchor="middle" font-weight="normal">How a light sensor becomes a number</text><rect x="30" y="56" width="300" height="320" rx="10" fill="#232325" stroke="#f5c48a" stroke-width="2"/><text x="180" y="86" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#f5c48a" text-anchor="middle" font-weight="normal">Bright room</text><line x1="140" y1="110" x2="140" y2="128" stroke="#ff9a9a" stroke-width="3" stroke-linecap="round"/><text x="154" y="120" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#ff9a9a" text-anchor="start" font-weight="normal">3.3 V</text><rect x="110" y="128" width="60" height="70" rx="6" fill="#232325" stroke="#f1eee6" stroke-width="2"/><text x="140" y="168" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f1eee6" text-anchor="middle" font-weight="normal">LDR</text><text x="184" y="168" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="start" font-weight="normal">LDR 1 kOhm</text><line x1="140" y1="198" x2="140" y2="222" stroke="#f1eee6" stroke-width="3" stroke-linecap="round"/><circle cx="140" cy="222" r="5" fill="#f5c48a" stroke="#f5c48a" stroke-width="1"/><line x1="140" y1="222" x2="230" y2="222" stroke="#f5c48a" stroke-width="3" stroke-linecap="round"/><text x="236" y="218" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f1eee6" text-anchor="start" font-weight="normal">to pin</text><text x="236" y="236" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f1eee6" text-anchor="start" font-weight="normal">GPIO 34</text><rect x="110" y="240" width="60" height="56" rx="6" fill="#232325" stroke="#f1eee6" stroke-width="2"/><text x="140" y="272" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f1eee6" text-