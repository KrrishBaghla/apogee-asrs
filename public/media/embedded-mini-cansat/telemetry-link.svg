<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img"><title>A CanSat ESP32 sends radio packets to a ground station ESP32, which passes them over USB to a laptop that draws live graphs</title><text x="360" y="30" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#f1eee6" text-anchor="middle" font-weight="normal">Telemetry: from the can to your screen</text><rect x="20" y="100" width="160" height="90" rx="10" fill="#232325" stroke="#86d8c9" stroke-width="2"/><text x="100.0" y="139.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#f1eee6" text-anchor="middle" font-weight="normal">CanSat</text><text x="100.0" y="161.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#a8a5a0" text-anchor="middle" font-weight="normal">ESP32 + sensors</text><rect x="280" y="100" width="160" height="90" rx="10" fill="#232325" stroke="#86d8c9" stroke-width="2"/><text x="360.0" y="139.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#f1eee6" text-anchor="middle" font-weight="normal">Ground station</text><text x="360.0" y="161.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#a8a5a0" text-anchor="middle" font-weight="normal">second ESP32</text><rect x="540" y="100" width="160" height="90" rx="10" fill="#232325" stroke="#86d8c9" stroke-width="2"/><text x="620.0" y="139.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#f1eee6" text-anchor="middle" font-weight="normal">Laptop</text><text x="620.0" y="161.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#a8a5a0" text-anchor="middle" font-weight="normal">Python live graph</text><line x1="182" y1="145" x2="274.0" y2="145.0" stroke="#f5c48a" stroke-width="3" stroke-linecap="round"/><polygon points="278,145 268.1,149.8 268.1,140.2" fill="#f5c48a"/><text x="230" y="122" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f5c48a" text-anchor="middle" font-weight="normal">radio</text><line x1="442" y1="145" x2="534.0" y2="145.0" stroke="#f5c48a" stroke-width="3" stroke-linecap="round"/><polygon points="538,145 528.1,149.8 528.1,140.2" fill="#f5c48a"/><text x="490" y="122" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f5c48a" text-anchor="middle" font-weight="normal">USB cable</text><rect x="20" y="230" width="340" height="120" rx="10" fill="#232325" stroke="#5e5c58" stroke-width="2"/><text x="190" y="258" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#f1eee6" text-anchor="middle" font-weight="normal">One packet, 20 bytes</text><rect x="32" y="274" width="60" height="40" rx="6" fill="#232325" stroke="#c8d86a" stroke-width="2"/><text x="62.0" y="299" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#c8d86a" text-anchor="middle" font-weight="normal">time</text><rect x="96" y="274" width="52" height="40" rx="6" fill="#232325" stroke="#ff9a9a" stroke-width="2"/><text x="122.0" y="299" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#ff9a9a" text-anchor="middle" font-weight="normal">temp</text><rect x="152" y="274" width="80" height="40" rx="6" fill="#232325" stroke="#ee9a6c" stroke-width="2"/><text x="192.0" y="299" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#ee9a6c" text-anchor="middle" font-weight="normal">pressure</text><rect x="236" y="274" width="66" height="40" rx="6" fill="#232325" stroke="#86d8c9" stroke-width="2"/><text x="269.0" y="299" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#86d8c9" text-anchor="middle" font-weight="normal">height</text><rect x="306" y="274" width="52" height="40" rx="6" fill="#232325" stroke="#f5c48a" stroke-width="2"/><text x="332.0" y="299" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f5c48a" text-anchor="middle" font-weight="normal">accel</text><text x="190" y="338" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="middle" font-weight="normal">5 fields x 4 bytes. The limit is 250 bytes.</text><rect x="390" y="230" width="310" height="120" rx="10" fill="#232325" stroke="#5e5c58" stroke-width="2"/><text x="545.0" y="274.9" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f1eee6" text-anchor="middle" font-weight="normal">Ground ESP32 prints</text><text x="545.0" y="294.9" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f1eee6" text-anchor="middle" font-weight="normal">one text line per packet</text><text x="545.0" y="314.9" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f5c48a" text-anchor="middle" font-weight="normal">12345,24.8,1006.2,53.1,9.8</text></svg>