<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img"><title>A soda can sized CanSat 66 millimetres wide and 115 millimetres tall with antenna, sensor board, ESP32 and battery stacked inside</title><text x="360" y="30" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#f1eee6" text-anchor="middle" font-weight="normal">Everything must fit inside a soda can</text><rect x="170" y="84" width="172" height="299" rx="14" fill="#1b1d44" stroke="#f1eee6" stroke-width="3"/><line x1="256.0" y1="84" x2="256.0" y2="58" stroke="#f5c48a" stroke-width="3" stroke-linecap="round"/><circle cx="256.0" cy="56" r="4" fill="#f5c48a" stroke="#f5c48a" stroke-width="1"/><rect x="184" y="96" width="144" height="56" rx="10" fill="#232325" stroke="#ee9a6c" stroke-width="2"/><text x="256.0" y="128.9" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f1eee6" text-anchor="middle" font-weight="normal">Sensor board</text><rect x="184" y="180" width="144" height="56" rx="10" fill="#232325" stroke="#86d8c9" stroke-width="2"/><text x="256.0" y="212.9" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f1eee6" text-anchor="middle" font-weight="normal">ESP32</text><rect x="184" y="264" width="144" height="90" rx="10" fill="#232325" stroke="#ff9a9a" stroke-width="2"/><text x="256.0" y="313.9" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f1eee6" text-anchor="middle" font-weight="normal">Battery</text><line x1="170" y1="398" x2="342" y2="398" stroke="#a8a5a0" stroke-width="2" stroke-linecap="round"/><text x="256.0" y="418" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#a8a5a0" text-anchor="middle" font-weight="normal">66 mm</text><line x1="110" y1="84" x2="110" y2="383" stroke="#a8a5a0" stroke-width="2" stroke-linecap="round"/><text x="104" y="233.5" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#a8a5a0" text-anchor="end" font-weight="normal">115 mm</text><line x1="350" y1="64" x2="402" y2="64" stroke="#5e5c58" stroke-width="2" stroke-linecap="round"/><text x="412" y="62" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f1eee6" text-anchor="start" font-weight="normal">Antenna</text><text x="412" y="82" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="start" font-weight="normal">(sticks out of the top)</text><line x1="350" y1="144" x2="402" y2="144" stroke="#5e5c58" stroke-width="2" stroke-linecap="round"/><text x="412" y="142" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f1eee6" text-anchor="start" font-weight="normal">BMP280 + MPU6050</text><text x="412" y="162" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="start" font-weight="normal">the sensors</text><line x1="350" y1="214" x2="402" y2="214" stroke="#5e5c58" stroke-width="2" stroke-linecap="round"/><text x="412" y="212" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f1eee6" text-anchor="start" font-weight="normal">ESP32</text><text x="412" y="232" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="start" font-weight="normal">brain and radio</text><line x1="350" y1="306" x2="402" y2="306" stroke="#5e5c58" stroke-width="2" stroke-linecap="round"/><text x="412" y="304" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f1eee6" text-anchor="start" font-weight="normal">Battery</text><text x="412" y="324" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="start" font-weight="normal">cell or power bank</text><rect x="500" y="352" width="200" height="56" rx="10" fill="#232325" stroke="#f5c48a" stroke-width="2"/><text x="600.0" y="374.75" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#a8a5a0" text-anchor="middle" font-weight="normal">Total mass:</text><text x="600.0" y="395.75" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f5c48a" text-anchor="middle" font-weight="normal">300 to 350 g</text></svg>