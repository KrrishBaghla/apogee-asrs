<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Verdana, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ee9a6c"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f5c48a"/></marker><marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5e5c58"/></marker></defs>
<text x="360" y="34" font-size="20" fill="#f1eee6" text-anchor="middle">Static hosting: same files for every visitor</text>
<rect x="24" y="100" width="170" height="120" rx="12" fill="none" stroke="#5e5c58" stroke-width="2"/><text x="109" y="156" font-size="17" fill="#f1eee6" text-anchor="middle">Repository</text><text x="109" y="182" font-size="15" fill="#a8a5a0" text-anchor="middle">HTML, CSS, JS</text>
<rect x="262" y="100" width="170" height="120" rx="12" fill="none" stroke="#ee9a6c" stroke-width="2.5"/><text x="347" y="156" font-size="17" fill="#f1eee6" text-anchor="middle">GitHub Pages</text><text x="347" y="182" font-size="15" fill="#a8a5a0" text-anchor="middle">serves the files</text>
<line x1="198" y1="160" x2="258" y2="160" stroke="#ee9a6c" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="436" y1="145" x2="508" y2="95" stroke="#f5c48a" stroke-width="2.5" marker-end="url(#g)"/>
<line x1="436" y1="160" x2="508" y2="160" stroke="#f5c48a" stroke-width="2.5" marker-end="url(#g)"/>
<line x1="436" y1="175" x2="508" y2="225" stroke="#f5c48a" stroke-width="2.5" marker-end="url(#g)"/>
<text x="516" y="100" font-size="16" fill="#f1eee6" text-anchor="start">A friend's phone</text>
<text x="516" y="166" font-size="16" fill="#f1eee6" text-anchor="start">Your laptop</text>
<text x="516" y="232" font-size="16" fill="#f1eee6" text-anchor="start">A recruiter</text>
<text x="360" y="300" font-size="18" fill="#f5c48a" text-anchor="middle" font-family="Consolas, Courier New, monospace">https://your-name.github.io/space-gallery/</text>
<text x="360" y="346" font-size="15" fill="#a8a5a0" text-anchor="middle">JavaScript runs in each visitor's browser,</text>
<text x="360" y="370" font-size="15" fill="#a8a5a0" text-anchor="middle">so NASA's data stays fresh without any changes.</text>
