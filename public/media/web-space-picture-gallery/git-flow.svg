<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Verdana, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ee9a6c"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f5c48a"/></marker><marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5e5c58"/></marker></defs>
<text x="360" y="34" font-size="20" fill="#f1eee6" text-anchor="middle">Three commands save and share your work</text>
<rect x="24" y="90" width="170" height="120" rx="12" fill="none" stroke="#5e5c58" stroke-width="2"/><text x="109" y="146" font-size="17" fill="#f1eee6" text-anchor="middle">Your files</text><text x="109" y="172" font-size="15" fill="#a8a5a0" text-anchor="middle">you edit here</text>
<rect x="275" y="90" width="170" height="120" rx="12" fill="none" stroke="#5e5c58" stroke-width="2"/><text x="360" y="146" font-size="17" fill="#f1eee6" text-anchor="middle">Local history</text><text x="360" y="172" font-size="15" fill="#a8a5a0" text-anchor="middle">on your laptop</text>
<rect x="526" y="90" width="170" height="120" rx="12" fill="none" stroke="#ee9a6c" stroke-width="2.5"/><text x="611" y="146" font-size="17" fill="#f1eee6" text-anchor="middle">GitHub</text><text x="611" y="172" font-size="15" fill="#a8a5a0" text-anchor="middle">safe online copy</text>
<line x1="198" y1="150" x2="271" y2="150" stroke="#ee9a6c" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="449" y1="150" x2="522" y2="150" stroke="#ee9a6c" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="235" y1="164" x2="235" y2="250" stroke="#5e5c58" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="485" y1="164" x2="485" y2="250" stroke="#5e5c58" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="235" y="276" font-size="17" fill="#f5c48a" text-anchor="middle" font-family="Consolas, Courier New, monospace">git add .</text>
<text x="235" y="302" font-size="17" fill="#f5c48a" text-anchor="middle" font-family="Consolas, Courier New, monospace">git commit</text>
<text x="485" y="276" font-size="17" fill="#f5c48a" text-anchor="middle" font-family="Consolas, Courier New, monospace">git push</text>
<text x="360" y="362" font-size="15" fill="#a8a5a0" text-anchor="middle">A commit is a saved snapshot you can always go back to.</text>
</svg>
