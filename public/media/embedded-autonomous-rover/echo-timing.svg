<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>The sensor sends a short sound, the echo returns, and the length of the echo pulse gives the distance</title><text x="360" y="28" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#f1eee6" text-anchor="middle" font-weight="normal">How the ultrasonic sensor measures distance</text><rect x="30" y="70" width="110" height="80" rx="10" fill="#232325" stroke="#86d8c9" stroke-width="2"/><text x="85.0" y="115.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#f1eee6" text-anchor="middle" font-weight="normal">Sensor</text><rect x="580" y="60" width="110" height="100" rx="10" fill="#232325" stroke="#5e5c58" stroke-width="2"/><text x="635.0" y="104.75" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f1eee6" text-anchor="middle" font-weight="normal">Wall or</text><text x="635.0" y="125.75" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#a8a5a0" text-anchor="middle" font-weight="normal">rock</text><line x1="142" y1="95" x2="572.0" y2="95.0" stroke="#f5c48a" stroke-width="3" stroke-linecap="round"/><polygon points="576,95 566.1,99.8 566.1,90.2" fill="#f5c48a"/><text x="360" y="84" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f5c48a" text-anchor="middle" font-weight="normal">sound goes out</text><line x1="576" y1="135" x2="146.0" y2="135.0" stroke="#ee9a6c" stroke-width="3" stroke-linecap="round"/><polygon points="142,135 151.9,130.2 151.9,139.8" fill="#ee9a6c"/><text x="360" y="160" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#ee9a6c" text-anchor="middle" font-weight="normal">echo comes back</text><text x="360" y="200" font-family="Verdana, Arial, sans-serif" font-size="18" fill="#f1eee6" text-anchor="middle" font-weight="normal">d = t x 0.0343 / 2</text><text x="360" y="226" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="middle" font-weight="normal">t in microseconds, d in cm. Divide by 2: the sound travels there and back.</text><text x="60" y="272" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f5c48a" text-anchor="start" font-weight="normal">TRIG</text><text x="60" y="342" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#ee9a6c" text-anchor="start" font-weight="normal">ECHO</text><path d="M 130 290 H 200 V 265 H 220 V 290 H 660" stroke="#f5c48a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 130 360 H 270 V 332 H 530 V 360 H 660" stroke="#ee9a6c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="210" y="256" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f5c48a" text-anchor="middle" font-weight="normal">10 µs pulse</text><line x1="270" y1="378" x2="530" y2="378" stroke="#a8a5a0" stroke-width="2" stroke-linecap="round"/><text x="400" y="404" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#a8a5a0" text-anchor="middle" font-weight="normal">t = 1166 µs  gives  d = 20 cm</text></svg>