<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>A loop: measure distance, drive forward if the way is clear, otherwise stop, reverse, look both ways and turn toward the clearer side</title><text x="360" y="28" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#f1eee6" text-anchor="middle" font-weight="normal">The rover's decision loop</text><rect x="30" y="90" width="170" height="60" rx="10" fill="#232325" stroke="#86d8c9" stroke-width="2"/><text x="115.0" y="114.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#f1eee6" text-anchor="middle" font-weight="normal">Measure</text><text x="115.0" y="136.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#a8a5a0" text-anchor="middle" font-weight="normal">distance</text><polygon points="400,60 510,120 400,180 290,120" fill="#232325" stroke="#f5c48a" stroke-width="2"/><text x="400" y="114" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f1eee6" text-anchor="middle" font-weight="normal">Closer than</text><text x="400" y="134" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f1eee6" text-anchor="middle" font-weight="normal">25 cm?</text><line x1="200" y1="120" x2="284.0" y2="120.0" stroke="#86d8c9" stroke-width="3" stroke-linecap="round"/><polygon points="288,120 278.1,124.8 278.1,115.2" fill="#86d8c9"/><rect x="585" y="95" width="120" height="50" rx="10" fill="#232325" stroke="#86d8c9" stroke-width="2"/><text x="645.0" y="114.75" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f1eee6" text-anchor="middle" font-weight="normal">Drive</text><text x="645.0" y="135.75" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#a8a5a0" text-anchor="middle" font-weight="normal">forward</text><line x1="512" y1="120" x2="579.0" y2="120.0" stroke="#86d8c9" stroke-width="3" stroke-linecap="round"/><polygon points="583,120 573.1,124.8 573.1,115.2" fill="#86d8c9"/><text x="548" y="108" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f5c48a" text-anchor="middle" font-weight="normal">no</text><path d="M 645 95 V 56 H 115 V 88" stroke="#86d8c9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polygon points="115,90 109,78 121,78" fill="#86d8c9"/><line x1="400" y1="182" x2="400.0" y2="221.0" stroke="#86d8c9" stroke-width="3" stroke-linecap="round"/><polygon points="400,225 395.2,215.1 404.8,215.1" fill="#86d8c9"/><text x="414" y="208" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f5c48a" text-anchor="start" font-weight="normal">yes</text><rect x="320" y="226" width="160" height="50" rx="10" fill="#232325" stroke="#86d8c9" stroke-width="2"/><text x="400.0" y="245.75" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f1eee6" text-anchor="middle" font-weight="normal">Stop and</text><text x="400.0" y="266.75" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#a8a5a0" text-anchor="middle" font-weight="normal">reverse a bit</text><line x1="400" y1="278" x2="400.0" y2="294.0" stroke="#86d8c9" stroke-width="3" stroke-linecap="round"/><polygon points="400,298 395.2,288.1 404.8,288.1" fill="#86d8c9"/><rect x="320" y="300" width="160" height="50" rx="10" fill="#232325" stroke="#86d8c9" stroke-width="2"/><text x="400.0" y="319.75" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f1eee6" text-anchor="middle" font-weight="normal">Look left,</text><text x="400.0" y="340.75" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#a8a5a0" text-anchor="middle" font-weight="normal">look right</text><line x1="400" y1="352" x2="400.0" y2="368.0" stroke="#86d8c9" stroke-width="3" stroke-linecap="round"/><polygon points="400,372 395.2,362.1 404.8,362.1" fill="#86d8c9"/><rect x="320" y="374" width="160" height="50" rx="10" fill="#232325" stroke="#86d8c9" stroke-width="2"/><text x="400.0" y="393.75" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f1eee6" text-anchor="middle" font-weight="normal">Turn to the</text><text x="400.0" y="414.75" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#a8a5a0" text-anchor="middle" font-weight="normal">clearer side</text><path d="M 320 399 H 115 V 152" stroke="#86d8c9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polygon points="115,150 109,162 121,162" fill="#86d8c9"/></svg>