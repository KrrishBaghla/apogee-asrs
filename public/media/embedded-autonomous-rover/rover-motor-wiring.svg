<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img"><title>ESP32 GPIO pins wired to the L298N inputs and enables, the L298N driving two motors from a 6 volt battery, with a shared ground</title><text x="360" y="28" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#f1eee6" text-anchor="middle" font-weight="normal">Motor wiring: ESP32, L298N driver and battery</text><rect x="20" y="45" width="180" height="340" rx="10" fill="#232325" stroke="#86d8c9" stroke-width="2"/><text x="110" y="80" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#f1eee6" text-anchor="middle" font-weight="normal">ESP32 board</text><rect x="330" y="45" width="150" height="340" rx="10" fill="#232325" stroke="#86d8c9" stroke-width="2"/><text x="405" y="80" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#f1eee6" text-anchor="middle" font-weight="normal">L298N</text><line x1="200" y1="115" x2="330" y2="115" stroke="#c8d86a" stroke-width="3" stroke-linecap="round"/><text x="194" y="120" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f1eee6" text-anchor="end" font-weight="normal">GPIO 25</text><text x="340" y="120" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="start" font-weight="normal">ENA</text><line x1="200" y1="150" x2="330" y2="150" stroke="#ffb870" stroke-width="3" stroke-linecap="round"/><text x="194" y="155" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f1eee6" text-anchor="end" font-weight="normal">GPIO 26</text><text x="340" y="155" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="start" font-weight="normal">IN1</text><line x1="200" y1="185" x2="330" y2="185" stroke="#ffb870" stroke-width="3" stroke-linecap="round"/><text x="194" y="190" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f1eee6" text-anchor="end" font-weight="normal">GPIO 27</text><text x="340" y="190" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="start" font-weight="normal">IN2</text><line x1="200" y1="220" x2="330" y2="220" stroke="#ffb870" stroke-width="3" stroke-linecap="round"/><text x="194" y="225" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f1eee6" text-anchor="end" font-weight="normal">GPIO 32</text><text x="340" y="225" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="start" font-weight="normal">IN3</text><line x1="200" y1="255" x2="330" y2="255" stroke="#ffb870" stroke-width="3" stroke-linecap="round"/><text x="194" y="260" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f1eee6" text-anchor="end" font-weight="normal">GPIO 33</text><text x="340" y="260" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="start" font-weight="normal">IN4</text><line x1="200" y1="290" x2="330" y2="290" stroke="#c8d86a" stroke-width="3" stroke-linecap="round"/><text x="194" y="295" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f1eee6" text-anchor="end" font-weight="normal">GPIO 13</text><text x="340" y="295" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="start" font-weight="normal">ENB</text><line x1="200" y1="325" x2="330" y2="325" stroke="#ff9a9a" stroke-width="3" stroke-linecap="round"/><text x="194" y="330" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f1eee6" text-anchor="end" font-weight="normal">VIN (5 V)</text><text x="340" y="330" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="start" font-weight="normal">5V</text><line x1="200" y1="360" x2="330" y2="360" stroke="#d0cdc7" stroke-width="3" stroke-linecap="round"/><text x="194" y="365" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f1eee6" text-anchor="end" font-weight="normal">GND</text><text x="340" y="365" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="start" font-weight="normal">GND</text><line x1="480" y1="125" x2="560" y2="125" stroke="#ffb870" stroke-width="3" stroke-linecap="round"/><line x1="480" y1="155" x2="560" y2="155" stroke="#ffb870" stroke-width="3" stroke-linecap="round"/><text x="472" y="130" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="end" font-weight="normal">OUT1</text><text x="472" y="160" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="end" font-weight="normal">OUT2</text><rect x="560" y="105" width="140" height="70" rx="10" fill="#232325" stroke="#5e5c58" stroke-width="2"/><text x="630.0" y="145.25" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f1eee6" text-anchor="middle" font-weight="normal">Left motor</text><line x1="480" y1="205" x2="560" y2="205" stroke="#ffb870" stroke-width="3" stroke-linecap="round"/><line x1="480" y1="235" x2="560" y2="235" stroke="#ffb870" stroke-width="3" stroke-linecap="round"/><text x="472" y="210" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="end" font-weight="normal">OUT3</text><text x="472" y="240" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="end" font-weight="normal">OUT4</text><rect x="560" y="185" width="140" height="70" rx="10" fill="#232325" stroke="#5e5c58" stroke-width="2"/><text x="630.0" y="225.25" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f1eee6" text-anchor="middle" font-weight="normal">Right motor</text><line x1="480" y1="305" x2="560" y2="305" stroke="#ff9a9a" stroke-width="3" stroke-linecap="round"/><text x="472" y="310" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="end" font-weight="normal">12V</text><line x1="480" y1="360" x2="560" y2="360" stroke="#d0cdc7" stroke-width="3" stroke-linecap="round"/><text x="472" y="365" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="end" font-weight="normal">GND</text><rect x="560" y="285" width="140" height="95" rx="10" fill="#232325" stroke="#f5c48a" stroke-width="2"/><text x="630.0" y="327.25" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f1eee6" text-anchor="middle" font-weight="normal">4 x AA</text><text x="630.0" y="348.25" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#a8a5a0" text-anchor="middle" font-weight="normal">6 V battery</text><text x="550" y="299" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#ff9a9a" text-anchor="end" font-weight="normal">+</text><text x="550" y="354" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#d0cdc7" text-anchor="end" font-weight="normal">-</text><text x="360" y="418" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f5c48a" text-anchor="middle" font-weight="normal">Remove the jumpers on ENA, ENB and 5V-EN.</text><text x="360" y="444" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="middle" font-weight="normal">Battery minus, driver GND and ESP32 GND all meet: a shared ground.</text><text x="360" y="468" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="middle" font-weight="normal">The 12V terminal is only the motor supply. 6 V is fine here.</text><text x="360" y="492" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="middle" font-weight="normal">Power the ESP32 from a USB power bank.</text></svg>