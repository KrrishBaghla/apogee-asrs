<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Verdana, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ee9a6c"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f5c48a"/></marker></defs>
<text x="360" y="32" font-size="20" fill="#f1eee6" text-anchor="middle">A pass is an arc across your sky</text>
<line x1="40" y1="290" x2="680" y2="290" stroke="#5e5c58" stroke-width="3"/>
<text x="40" y="318" font-size="15" fill="#a8a5a0" text-anchor="start">rises: azimuth 233</text>
<text x="680" y="318" font-size="15" fill="#a8a5a0" text-anchor="end">sets: azimuth 37</text>
<rect x="40" y="250" width="640" height="40" rx="4" fill="none" stroke="#5e5c58" stroke-width="1" stroke-dasharray="4 5"/>
<path d="M80 290 Q360 10 640 290" fill="none" stroke="#ee9a6c" stroke-width="3.5"/>
<circle cx="360" cy="290" r="7" fill="#f5c48a"/>
<text x="360" y="318" font-size="15" fill="#f5c48a" text-anchor="middle">you</text>
<line x1="360" y1="278" x2="360" y2="160" stroke="#f5c48a" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="360" cy="150" r="9" fill="#ee9a6c"/>
<text x="378" y="128" font-size="15" fill="#ee9a6c" text-anchor="start">ISS at its peak</text>
<text x="378" y="152" font-size="15" fill="#f5c48a" text-anchor="start">elevation 49 degrees</text>
<text x="190" y="276" font-size="15" fill="#a8a5a0" text-anchor="start">under 10: hidden</text>
<text x="360" y="352" font-size="15" fill="#a8a5a0" text-anchor="middle">Elevation: how high above the horizon.</text>
<text x="360" y="378" font-size="15" fill="#a8a5a0" text-anchor="middle">Azimuth: compass bearing. 0 is north, 90 is east.</text>
