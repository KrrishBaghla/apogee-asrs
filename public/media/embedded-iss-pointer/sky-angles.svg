ext><text x="180" y="366" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#a8a5a0" text-anchor="middle" font-weight="normal">Azimuth: compass direction,</text><text x="180" y="388" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#a8a5a0" text-anchor="middle" font-weight="normal">0 to 360, clockwise from north</text><line x1="390" y1="300" x2="700" y2="300" stroke="#f1eee6" stroke-width="3" stroke-linecap="round"/><text x="700" y="320" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="end" font-weight="normal">horizon</text><circle cx="420" cy="300" r="6" fill="#f1eee6" stroke="#f1eee6" stroke-width="1"/><text x="420" y="320" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#f1eee6" text-anchor="middle" font-weight="normal">you</text><line x1="420" y1="300" x2="608.4049701864681" y2="168.0774196392594" stroke="#f5c48a" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/><circle cx="608.4049701864681" cy="168.0774196392594" r="8" fill="#f5c48a" stroke="#f5c48a" stroke-width="1"/><text x="608.4049701864681" y="152.0774196392594" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#f5c48a" text-anchor="middle" font-weight="normal">ISS</text><path d="M 500 300 A 80 80 0 0 0 485.5 254.1" stroke="#f5c48a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="512" y="278" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f5c48a" text-anchor="start" font-weight="normal">35°</text><text x="540" y="350" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#a8a5a0" text-anchor="middle" font-weight="normal">Elevation: height above the horizon,</text><text x="540" y="372" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#a8a5a0" text-anchor="middle" font-weight="normal">0 at the horizon, 90 straight up</text></svg>