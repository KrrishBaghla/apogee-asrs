<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img"><title>A tilted ISS orbit around Earth, and a TLE feeding orbit maths to give the ISS position</title><text x="180" y="34" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#86d8c9" text-anchor="middle" font-weight="normal">One orbit, tilted</text><text x="540" y="34" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#86d8c9" text-anchor="middle" font-weight="normal">From numbers to a pointing angle</text><circle cx="190" cy="215" r="62" fill="#2a4a6a" stroke="#86d8c9" stroke-width="2"/><line x1="30" y1="215" x2="350" y2="215" stroke="#5e5c58" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><text x="342" y="237" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="end" font-weight="normal">equator</text><ellipse cx="190" cy="215" rx="125" ry="26" transform="rotate(-51.6 190 215)" fill="none" stroke="#f5c48a" stroke-width="3"/><path d="M 260 215 A 70 70 0 0 0 233.5 160.1" stroke="#f1eee6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="270" y="195" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f1eee6" text-anchor="start" font-weight="normal">51.6°</text><text x="180" y="352" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f5c48a" text-anchor="middle" font-weight="normal">ISS orbit tilt: 51.6°</text><text x="180" y="376" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f5c48a" text-anchor="middle" font-weight="normal">One lap: about 93 minutes</text><rect x="420" y="62" width="240" height="64" rx="10" fill="#232325" stroke="#86d8c9" stroke-width="2"/><text x="540.0" y="88.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#f1eee6" text-anchor="middle" font-weight="normal">TLE</text><text x="540.0" y="110.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#a8a5a0" text-anchor="middle" font-weight="normal">2 lines of numbers</text><line x1="540" y1="128" x2="540.0" y2="160.0" stroke="#f5c48a" stroke-width="3" stroke-linecap="round"/><polygon points="540,164 535.2,154.1 544.8,154.1" fill="#f5c48a"/><rect x="420" y="166" width="240" height="64" rx="10" fill="#232325" stroke="#86d8c9" stroke-width="2"/><text x="540.0" y="192.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#f1eee6" text-anchor="middle" font-weight="normal">Orbit maths</text><text x="540.0" y="214.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#a8a5a0" text-anchor="middle" font-weight="normal">SGP4 formulas</text><line x1="540" y1="232" x2="540.0" y2="264.0" stroke="#f5c48a" stroke-width="3" stroke-linecap="round"/><polygon points="540,268 535.2,258.1 544.8,258.1" fill="#f5c48a"/><rect x="420" y="270" width="240" height="64" rx="10" fill="#232325" stroke="#f5c48a" stroke-width="2"/><text x="540.0" y="296.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#f1eee6" text-anchor="middle" font-weight="normal">Position</text><text x="540.0" y="318.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#a8a5a0" text-anchor="middle" font-weight="normal">where is it right now?</text><text x="540" y="378" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="middle" font-weight="normal">from CelesTrak, updated often</text></svg>