<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Verdana, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ee9a6c"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f5c48a"/></marker></defs>
<text x="360" y="32" font-size="20" fill="#f1eee6" text-anchor="middle">Solar flare classes: each step is 10 times stronger</text>
<rect x="60" y="120" width="120" height="90" fill="#4d6a9c" stroke="#161617" stroke-width="3"/>
<text x="120" y="176" font-size="36" fill="#161617" text-anchor="middle" font-weight="bold">A</text>
<rect x="180" y="120" width="120" height="90" fill="#6f8fc9" stroke="#161617" stroke-width="3"/>
<text x="240" y="176" font-size="36" fill="#161617" text-anchor="middle" font-weight="bold">B</text>
<rect x="300" y="120" width="120" height="90" fill="#9fb8e6" stroke="#161617" stroke-width="3"/>
<text x="360" y="176" font-size="36" fill="#161617" text-anchor="middle" font-weight="bold">C</text>
<rect x="420" y="120" width="120" height="90" fill="#f5c48a" stroke="#161617" stroke-width="3"/>
<text x="480" y="176" font-size="36" fill="#161617" text-anchor="middle" font-weight="bold">M</text>
<rect x="540" y="120" width="120" height="90" fill="#ef8a5a" stroke="#161617" stroke-width="3"/>
<text x="600" y="176" font-size="36" fill="#161617" text-anchor="middle" font-weight="bold">X</text>
<text x="60" y="240" font-size="15" fill="#a8a5a0" text-anchor="middle" font-family="Consolas, Courier New, monospace">1e-8</text>
<line x1="60" y1="210" x2="60" y2="224" stroke="#5e5c58" stroke-width="1.5"/>
<text x="180" y="240" font-size="15" fill="#a8a5a0" text-anchor="middle" font-family="Consolas, Courier New, monospace">1e-7</text>
<line x1="180" y1="210" x2="180" y2="224" stroke="#5e5c58" stroke-width="1.5"/>
<text x="300" y="240" font-size="15" fill="#a8a5a0" text-anchor="middle" font-family="Consolas, Courier New, monospace">1e-6</text>
<line x1="300" y1="210" x2="300" y2="224" stroke="#5e5c58" stroke-width="1.5"/>
<text x="420" y="240" font-size="15" fill="#a8a5a0" text-anchor="middle" font-family="Consolas, Courier New, monospace">1e-5</text>
<line x1="420" y1="210" x2="420" y2="224" stroke="#5e5c58" stroke-width="1.5"/>
<text x="540" y="240" font-size="15" fill="#a8a5a0" text-anchor="middle" font-family="Consolas, Courier New, monospace">1e-4</text>
<line x1="540" y1="210" x2="540" y2="224" stroke="#5e5c58" stroke-width="1.5"/>
<text x="360" y="276" font-size="15" fill="#a8a5a0" text-anchor="middle">X-ray flux in watts per square metre</text>
<path d="M292.1398141492281 112 l-9 -20 h18 z" fill="#f5c48a"/>
<text x="292.1398141492281" y="78" font-size="15" fill="#f5c48a" text-anchor="middle">8.6e-7 = B8.6</text>
<text x="292.1398141492281" y="58" font-size="15" fill="#a8a5a0" text-anchor="middle">an example reading, 7 Nov 2026</text>
<text x="360" y="330" font-size="15" fill="#f1eee6" text-anchor="middle">Letter plus number: M5.0 means 5 times 1e-5.</text>
<text x="360" y="358" font-size="15" fill="#a8a5a0" text-anchor="middle">M and X flares can disturb radio signals on Earth.</text>
</svg>
