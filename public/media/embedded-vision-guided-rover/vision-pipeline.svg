<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img"><title>Six steps: camera frame, find markers, make a grid, A star search, steering and sending speeds to the rover</title><text x="360" y="28" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#f1eee6" text-anchor="middle" font-weight="normal">What the laptop does, many times a second</text><rect x="20" y="70" width="180" height="80" rx="10" fill="#232325" stroke="#86d8c9" stroke-width="2"/><text x="110.0" y="104.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#f1eee6" text-anchor="middle" font-weight="normal">1 Camera</text><text x="110.0" y="126.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#a8a5a0" text-anchor="middle" font-weight="normal">overhead frame</text><rect x="270" y="70" width="180" height="80" rx="10" fill="#232325" stroke="#86d8c9" stroke-width="2"/><text x="360.0" y="104.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#f1eee6" text-anchor="middle" font-weight="normal">2 Find markers</text><text x="360.0" y="126.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#a8a5a0" text-anchor="middle" font-weight="normal">rover and goal</text><rect x="520" y="70" width="180" height="80" rx="10" fill="#232325" stroke="#86d8c9" stroke-width="2"/><text x="610.0" y="104.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#f1eee6" text-anchor="middle" font-weight="normal">3 Make a grid</text><text x="610.0" y="126.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#a8a5a0" text-anchor="middle" font-weight="normal">rocks are blocked</text><rect x="520" y="250" width="180" height="80" rx="10" fill="#232325" stroke="#f5c48a" stroke-width="2"/><text x="610.0" y="284.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#f1eee6" text-anchor="middle" font-weight="normal">4 A* search</text><text x="610.0" y="306.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#a8a5a0" text-anchor="middle" font-weight="normal">shortest safe path</text><rect x="270" y="250" width="180" height="80" rx="10" fill="#232325" stroke="#86d8c9" stroke-width="2"/><text x="360.0" y="284.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#f1eee6" text-anchor="middle" font-weight="normal">5 Steering</text><text x="360.0" y="306.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#a8a5a0" text-anchor="middle" font-weight="normal">angle to next point</text><rect x="20" y="250" width="180" height="80" rx="10" fill="#232325" stroke="#86d8c9" stroke-width="2"/><text x="110.0" y="284.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#f1eee6" text-anchor="middle" font-weight="normal">6 Send by Wi-Fi</text><text x="110.0" y="306.6" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#a8a5a0" text-anchor="middle" font-weight="normal">left, right speeds</text><line x1="202" y1="110" x2="264.0" y2="110.0" stroke="#f5c48a" stroke-width="3" stroke-linecap="round"/><polygon points="268,110 258.1,114.8 258.1,105.2" fill="#f5c48a"/><line x1="452" y1="110" x2="514.0" y2="110.0" stroke="#f5c48a" stroke-width="3" stroke-linecap="round"/><polygon points="518,110 508.1,114.8 508.1,105.2" fill="#f5c48a"/><line x1="610" y1="152" x2="610.0" y2="244.0" stroke="#f5c48a" stroke-width="3" stroke-linecap="round"/><polygon points="610,248 605.2,238.1 614.8,238.1" fill="#f5c48a"/><line x1="518" y1="290" x2="456.0" y2="290.0" stroke="#f5c48a" stroke-width="3" stroke-linecap="round"/><polygon points="452,290 461.9,285.2 461.9,294.8" fill="#f5c48a"/><line x1="268" y1="290" x2="206.0" y2="290.0" stroke="#f5c48a" stroke-width="3" stroke-linecap="round"/><polygon points="202,290 211.9,285.2 211.9,294.8" fill="#f5c48a"/><text x="360" y="380" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#a8a5a0" text-anchor="middle" font-weight="normal">The rover only follows speed commands. The planning happens on the laptop.</text></svg>