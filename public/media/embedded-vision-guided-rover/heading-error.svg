<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img"><title>A rover with a heading arrow and a dashed line to the next path point, with the angle between them marked as the error, and the two rules for what the rover does</title><text x="190" y="34" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#86d8c9" text-anchor="middle" font-weight="normal">Heading error</text><text x="540" y="34" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#86d8c9" text-anchor="middle" font-weight="normal">What the rover does</text><circle cx="190" cy="300" r="8" fill="#f1eee6" stroke="#f1eee6" stroke-width="1"/><text x="190" y="328" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f1eee6" text-anchor="middle" font-weight="normal">rover</text><line x1="190" y1="300" x2="190.0" y2="114.0" stroke="#86d8c9" stroke-width="4" stroke-linecap="round"/><polygon points="190,110 194.8,119.9 185.2,119.9" fill="#86d8c9"/><text x="176" y="102" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#86d8c9" text-anchor="end" font-weight="normal">heading</text><line x1="190" y1="300" x2="312.12964584044244" y2="154.4515558073942" stroke="#f5c48a" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/><circle cx="312.12964584044244" cy="154.4515558073942" r="8" fill="#f5c48a" stroke="#f5c48a" stroke-width="1"/><text x="312.12964584044244" y="138.4515558073942" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f5c48a" text-anchor="middle" font-weight="normal">next point</text><path d="M 190 210 A 90 90 0 0 1 247.9 231.1" stroke="#f1eee6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="196" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f1eee6" text-anchor="start" font-weight="normal">error</text><rect x="400" y="70" width="290" height="100" rx="10" fill="#232325" stroke="#f5c48a" stroke-width="2"/><text x="545.0" y="104.25" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f5c48a" text-anchor="middle" font-weight="normal">Error over 30°</text><text x="545.0" y="125.25" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f1eee6" text-anchor="middle" font-weight="normal">Spin on the spot</text><text x="545.0" y="146.25" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#a8a5a0" text-anchor="middle" font-weight="normal">until roughly facing it</text><rect x="400" y="200" width="290" height="110" rx="10" fill="#232325" stroke="#86d8c9" stroke-width="2"/><text x="545.0" y="239.25" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#86d8c9" text-anchor="middle" font-weight="normal">Error 30° or less</text><text x="545.0" y="260.25" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#f1eee6" text-anchor="middle" font-weight="normal">Drive forward and</text><text x="545.0" y="281.25" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#a8a5a0" text-anchor="middle" font-weight="normal">nudge the speeds</text><text x="545" y="350" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="middle" font-weight="normal">Error is the target angle minus</text><text x="545" y="372" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#a8a5a0" text-anchor="middle" font-weight="normal">the heading, wrapped to -180 to 180.</text></svg>